name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      # Only the 'dev' extra — tests fake the provider + LLM judge, so no
      # network, no API keys, no cost. (langchain is intentionally absent so the
      # "missing dep gives a helpful error" test exercises that path.)
      - run: uv sync --extra dev
      - run: uv run pytest -q

  secrets:
    name: secret scan (detect-secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: detect-secrets
        run: |
          files=$(git ls-files | grep -vE '^samples/|^uv\.lock$|^\.secrets\.baseline$')
          uv run detect-secrets-hook --baseline .secrets.baseline $files

  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    needs: [test, secrets]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv build
      - run: uv run python -c "import pathlib; print('\n'.join(p.name for p in pathlib.Path('dist').iterdir()))"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
