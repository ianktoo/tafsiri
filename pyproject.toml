[project]
name = "tafsiri"
version = "0.1.0"
description = "Generate and evaluate African-language translation data (via Daraja AI's Babel) into fine-tuning-ready datasets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["translation", "african-languages", "fine-tuning", "evaluation", "daraja", "babel"]
dependencies = [
    "python-dotenv>=1.0",
    "requests>=2.31",
    "rich>=13",
]

[project.optional-dependencies]
# LLM-as-judge is provider-agnostic via LangChain. Install the integration you want.
judge = [
    "langchain>=0.3",
    "langchain-core>=0.3",
]
openai = [
    "langchain>=0.3",
    "langchain-openai>=0.2",
]
anthropic = [
    "langchain>=0.3",
    "langchain-anthropic>=0.2",
]
gemini = [
    "langchain>=0.3",
    "langchain-google-genai>=2.0",
]
ollama = [
    "langchain>=0.3",
    "langchain-ollama>=0.2",
]
dev = [
    "pytest>=8.0",
    "pre-commit>=3.7",
    "detect-secrets>=1.5",
]

[project.scripts]
tafsiri = "tafsiri.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tafsiri"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
